<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>دفتري - نظام الأقساط</title>

<style>
:root {
  --bg: #080808;
  --panel: #151515;
  --panel2: #202020;
  --gold: #ffd700;
  --text: #f5f5f5;
  --muted: #b9b9b9;
  --line: #343434;
  --danger: #ff7777;
  --ok: #7ee0a0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Tahoma, sans-serif;
  line-height: 1.6;
}

header {
  background: #050505;
  border-bottom: 1px solid #574900;
  padding: 18px 14px;
  text-align: center;
}

header h1 {
  margin: 0;
  color: var(--gold);
  font-size: 30px;
}

header p {
  margin: 4px 0 0;
  color: var(--muted);
}

.container {
  width: min(100% - 24px, 760px);
  margin: 22px auto;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 25px #0005;
}

h2, h3 {
  color: var(--gold);
  margin-top: 0;
}

label {
  display: block;
  margin-top: 12px;
  color: #e7e7e7;
  font-size: 14px;
}

input, textarea {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 9px;
  background: #0e0e0e;
  color: white;
  font-size: 16px;
}

input:focus, textarea:focus {
  outline: 1px solid var(--gold);
  border-color: var(--gold);
}

button {
  border: 0;
  border-radius: 9px;
  background: var(--gold);
  color: #111;
  font-size: 15px;
  font-weight: bold;
  padding: 12px 15px;
  cursor: pointer;
  margin-top: 12px;
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

button.secondary {
  background: #303030;
  color: #fff;
  border: 1px solid #484848;
}

button.danger {
  background: #552020;
  color: #fff;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.actions button {
  flex: 1;
  min-width: 120px;
}

.hidden {
  display: none !important;
}

.message {
  margin-top: 12px;
  padding: 11px;
  border-radius: 8px;
  background: #252525;
  overflow-wrap: anywhere;
}

.message.error {
  border: 1px solid #8d3535;
  color: #ffb1b1;
}

.message.success {
  border: 1px solid #34734a;
  color: #a8f0bd;
}

.muted {
  color: var(--muted);
  font-size: 14px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.stat {
  background: #101010;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  min-width: 0;
}

.stat small {
  display: block;
  color: var(--muted);
}

.stat strong {
  display: block;
  color: var(--gold);
  overflow-wrap: anywhere;
}

.customer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.customer:last-child {
  border-bottom: 0;
}

.customer h3 {
  margin: 0;
  color: #fff;
  font-size: 17px;
}

.customer p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.customer button {
  margin: 0;
  white-space: nowrap;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.detail {
  padding: 12px;
  background: #101010;
  border: 1px solid var(--line);
  border-radius: 9px;
}

.detail span {
  display: block;
  color: var(--muted);
  font-size: 13px;
}

.detail strong {
  display: block;
  overflow-wrap: anywhere;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  text-align: right;
  padding: 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

th {
  color: var(--gold);
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
  font-size: 13px;
}

@media (max-width: 520px) {
  .stats {
    grid-template-columns: 1fr;
  }

  .detail-grid {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 16px;
  }

  .customer {
    align-items: flex-start;
  }

  .customer button {
    padding: 10px;
  }
}
    </style>
</head>

<body>

<header>
  <h1>دفتري</h1>
  <p>نظام إدارة المحلات والأقساط إلكترونياً</p>
  <p id="headerStatus" class="muted">حسابك التجاري</p>
</header>

<main class="container">

  <section class="card" id="authSection">

    <div id="authTabs" class="actions">
      <button type="button" data-auth="login">
        تسجيل الدخول
      </button>

      <button type="button" class="secondary" data-auth="register">
        إنشاء حساب
      </button>

      <button type="button" class="secondary" data-auth="forgot">
        نسيت كلمة المرور
      </button>
    </div>

    <div id="authMessage" aria-live="polite"></div>

    <form id="loginForm">
      <h2>تسجيل الدخول</h2>

      <label for="loginEmail">البريد الإلكتروني</label>
      <input
        id="loginEmail"
        type="email"
        autocomplete="email"
        required
      >

      <label for="loginPassword">كلمة المرور</label>
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">دخول إلى متجري</button>
    </form>

    <form id="registerForm" class="hidden">
      <h2>إنشاء حساب متجر</h2>

      <label for="ownerName">اسم صاحب المتجر</label>
      <input id="ownerName" autocomplete="name" required>

      <label for="fatherName">اسم الأب</label>
      <input id="fatherName" required>

      <label for="shopName">اسم المحل أو الشركة</label>
      <input id="shopName" required>

      <label for="shopAddress">عنوان المتجر</label>
      <input id="shopAddress" required>

      <label for="registerEmail">البريد الإلكتروني</label>
      <input
        id="registerEmail"
        type="email"
        autocomplete="email"
        required
      >

      <label for="registerPassword">
        كلمة المرور 6 حرفاً على الأقل)
      </label>
      <input
        id="registerPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <button type="submit">
        إنشاء الحساب وإرسال رمز التحقق
      </button>
    </form>

    <form id="verifyForm" class="hidden">
      <h2>تأكيد البريد الإلكتروني</h2>

      <p class="muted">
        أدخل البريد الإلكتروني والرمز المكوّن من 6 أرقام
        الذي وصلك بالبريد.
      </p>

      <label for="verifyEmail">البريد الإلكتروني</label>
      <input id="verifyEmail" type="email" required>

      <label for="verifyCode">رمز التحقق</label>
      <input
        id="verifyCode"
        inputmode="numeric"
        autocomplete="one-time-code"
        pattern="[0-9]{6}"
        maxlength="6"
        required
      >

      <button type="submit">تأكيد البريد</button>

      <button type="button" id="resendCode" class="secondary">
        إعادة إرسال الرمز
      </button>
    </form>

    <form id="forgotForm" class="hidden">
      <h2>استرجاع كلمة المرور</h2>

      <label for="forgotEmail">البريد الإلكتروني المسجل</label>
      <input id="forgotEmail" type="email" required>

      <button type="submit">إرسال رابط الاسترجاع</button>
    </form>

    <form id="resetForm" class="hidden">
      <h2>تعيين كلمة مرور جديدة</h2>

      <label for="resetPassword">كلمة المرور الجديدة</label>
      <input
        id="resetPassword"
        type="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <label for="resetConfirm">تأكيد كلمة المرور</label>
      <input
        id="resetConfirm"
        type="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <button type="submit">حفظ كلمة المرور الجديدة</button>
    </form>

  </section>
</main>
<script>
const $ = id => document.getElementById(id);

const forms = [
  "loginForm",
  "registerForm",
  "verifyForm",
  "forgotForm",
  "resetForm"
];

function showForm(id) {
  forms.forEach(formId => $(formId).classList.add("hidden"));
  $(id).classList.remove("hidden");

  $("authMessage").textContent = "";
  $("authMessage").className = "";

  const isReset = id === "resetForm";
  $("authTabs").classList.toggle(
    "hidden",
    isReset || id === "verifyForm"
  );
}

function showMessage(text, success = false) {
  const el = $("authMessage");
  el.textContent = text;
  el.className = "message " + (success ? "success" : "error");
}

async function sendRequest(path, data) {
  const response = await fetch("/api" + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify(data)
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      result.error || result.message || "حدث خطأ، حاول مرة أخرى."
    );
  }

  return result;
}

$("authTabs").addEventListener("click", event => {
  const type = event.target.dataset.auth;

  if (type === "login") showForm("loginForm");
  if (type === "register") showForm("registerForm");
  if (type === "forgot") {
    $("forgotEmail").value = $("loginEmail").value;
    showForm("forgotForm");
  }
});

$("registerForm").addEventListener("submit", async event => {
  event.preventDefault();

  const password = $("registerPassword").value;

  if (password.length < 6) {
    return showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
  }

  if (password !== $("confirmPassword").value) {
    return showMessage("كلمتا المرور غير متطابقتين.");
  }

  const button = event.submitter;
  if (button) button.disabled = true;

  try {
    const result = await sendRequest("/auth/register", {
      ownerName: $("ownerName").value.trim(),
      fatherName: $("fatherName").value.trim(),
      shopName: $("shopName").value.trim(),
      shopAddress: $("shopAddress").value.trim(),
      email: $("registerEmail").value.trim(),
      password
    });

    $("verifyEmail").value = $("registerEmail").value.trim();
    showForm("verifyForm");
    showMessage(
      result.message  || "تحقق من بريدك الإلكتروني للحصول على رمز التفعيل.",
      true
    );
  } catch (error) {
    showMessage(error.message);
  } finally {
    if (button) button.disabled = false;
  }
});

$("verifyForm").addEventListener("submit", async event => {
  event.preventDefault();

  try {
    const result = await sendRequest("/auth/verify-email", {
      email: $("verifyEmail").value.trim(),
      code: $("verifyCode").value.trim()
    });

    showForm("loginForm");
    $("loginEmail").value = $("verifyEmail").value.trim();
    showMessage(result.message || "تم التحقق. يمكنك تسجيل الدخول الآن.", true);
  } catch (error) {
    showMessage(error.message);
  }
});

$("resendCode").addEventListener("click", async () => {
  try {
    const result = await sendRequest("/auth/resend-code", {
      email: $("verifyEmail").value.trim()
    });

    showMessage(result.message || "تم طلب إعادة إرسال الرمز.", true);
  } catch (error) {
    showMessage(error.message);
  }
});

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  try {
    const result = await sendRequest("/auth/login", {
      email: $("loginEmail").value.trim(),
      password: $("loginPassword").value
    });

    showMessage(
      result.message || "تم تسجيل الدخول بنجاح.",
      true
    );

    // إذا كان الخادم يعيد رابط لوحة التحكم، انتقل إليه.
    if (result.redirect) {
      location.href = result.redirect;
    }
  } catch (error) {
    showMessage(error.message);
  }
});

$("forgotForm").addEventListener("submit", async event => {
  event.preventDefault();

  try {
    const result = await sendRequest("/auth/forgot-password", {
      email: $("forgotEmail").value.trim()
    });

    showMessage(
      result.message  "إذا كان البريد مسجلاً، فستصلك تعليمات الاسترجاع.",
      true
    );
    } catch (error) {
    showMessage(error.message);
  }
});

$("resetForm").addEventListener("submit", async event => {
  event.preventDefault();

  const password = $("resetPassword").value;

  if (password.length < 6) {
    return showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
  }

  if (password !== $("resetConfirm").value) {
    return showMessage("كلمتا المرور غير متطابقتين.");
  }

  const token = new URLSearchParams(location.search).get("token");

  if (!token) {
    return showMessage("رابط الاسترجاع غير صالح أو انتهت صلاحيته.");
  }

  try {
    const result = await sendRequest("/auth/reset-password", {
      token,
      password
    });

    history.replaceState({}, "", location.pathname);
    showForm("loginForm");
    showMessage(result.message || "تم تغيير كلمة المرور.", true);
  } catch (error) {
    showMessage(error.message);
  }
});

// فتح نموذج الاسترجاع تلقائياً عند وجود رمز في الرابط.
if (new URLSearchParams(location.search).has("token")) {
  showForm("resetForm");
} else {
  showForm("loginForm");
}
</script>
</body>
</html>
