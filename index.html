<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>دفتري - نظام الأقساط</title>

<style>
:root {
  --bg: #080808;
  --panel: #151515;
  --panel2: #202020;
  --gold: #ffd700;
  --text: #f5f5f5;
  --muted: #b9b9b9;
  --line: #343434;
  --danger: #ff7777;
  --ok: #7ee0a0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Tahoma, sans-serif;
  line-height: 1.6;
}

header {
  background: #050505;
  border-bottom: 1px solid #574900;
  padding: 18px 14px;
  text-align: center;
}

header h1 {
  margin: 0;
  color: var(--gold);
  font-size: 30px;
}

header p {
  margin: 4px 0 0;
  color: var(--muted);
}

.container {
  width: min(100% - 24px, 760px);
  margin: 22px auto;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 8px 25px #0005;
}

h2, h3 {
  color: var(--gold);
  margin-top: 0;
}

label {
  display: block;
  margin-top: 12px;
  color: #e7e7e7;
  font-size: 14px;
}

input, textarea {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 9px;
  background: #0e0e0e;
  color: white;
  font-size: 16px;
}

input:focus, textarea:focus {
  outline: 1px solid var(--gold);
  border-color: var(--gold);
}

button {
  border: 0;
  border-radius: 9px;
  background: var(--gold);
  color: #111;
  font-size: 15px;
  font-weight: bold;
  padding: 12px 15px;
  cursor: pointer;
  margin-top: 12px;
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

button.secondary {
  background: #303030;
  color: #fff;
  border: 1px solid #484848;
}

button.danger {
  background: #552020;
  color: #fff;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.actions button {
  flex: 1;
  min-width: 120px;
}

.hidden {
  display: none !important;
}

.message {
  margin-top: 12px;
  padding: 11px;
  border-radius: 8px;
  background: #252525;
  overflow-wrap: anywhere;
}

.message.error {
  border: 1px solid #8d3535;
  color: #ffb1b1;
}

.message.success {
  border: 1px solid #34734a;
  color: #a8f0bd;
}

.muted {
  color: var(--muted);
  font-size: 14px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.stat {
  background: #101010;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  min-width: 0;
}

.stat small {
  display: block;
  color: var(--muted);
}

.stat strong {
  display: block;
  color: var(--gold);
  overflow-wrap: anywhere;
}

.customer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.customer:last-child {
  border-bottom: 0;
}

.customer h3 {
  margin: 0;
  color: #fff;
  font-size: 17px;
}

.customer p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.customer button {
  margin: 0;
  white-space: nowrap;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.detail {
  padding: 12px;
  background: #101010;
  border: 1px solid var(--line);
  border-radius: 9px;
}

.detail span {
  display: block;
  color: var(--muted);
  font-size: 13px;
}

.detail strong {
  display: block;
  overflow-wrap: anywhere;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  text-align: right;
  padding: 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

th {
  color: var(--gold);
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
  font-size: 13px;
}

@media (max-width: 520px) {
  .stats {
    grid-template-columns: 1fr;
  }

  .detail-grid {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 16px;
  }

  .customer {
    align-items: flex-start;
  }

  .customer button {
    padding: 10px;
  }
}
    </style>
</head>

<body>

<header>
  <h1>دفتري</h1>
  <p>نظام إدارة المحلات والأقساط إلكترونياً</p>
  <p id="headerStatus" class="muted">حسابك التجاري</p>
</header>

<main class="container">

  <section class="card" id="authSection">

    <div id="authTabs" class="actions">
      <button type="button" data-auth="login">
        تسجيل الدخول
      </button>

      <button type="button" class="secondary" data-auth="register">
        إنشاء حساب
      </button>

      <button type="button" class="secondary" data-auth="forgot">
        نسيت كلمة المرور
      </button>
    </div>

    <div id="authMessage" aria-live="polite"></div>

    <form id="loginForm">
      <h2>تسجيل الدخول</h2>

      <label for="loginEmail">البريد الإلكتروني</label>
      <input
        id="loginEmail"
        type="email"
        autocomplete="email"
        required
      >

      <label for="loginPassword">كلمة المرور</label>
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">دخول إلى متجري</button>
    </form>

    <form id="registerForm" class="hidden">
      <h2>إنشاء حساب متجر</h2>

      <label for="ownerName">اسم صاحب المتجر</label>
      <input id="ownerName" autocomplete="name" required>

      <label for="fatherName">اسم الأب</label>
      <input id="fatherName" required>

      <label for="shopName">اسم المحل أو الشركة</label>
      <input id="shopName" required>

      <label for="shopAddress">عنوان المتجر</label>
      <input id="shopAddress" required>

      <label for="registerEmail">البريد الإلكتروني</label>
      <input
        id="registerEmail"
        type="email"
        autocomplete="email"
        required
      >

      <label for="registerPassword">
        كلمة المرور (12 حرفاً على الأقل)
      </label>
      <input
        id="registerPassword"
        type="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <button type="submit">
        إنشاء الحساب وإرسال رمز التحقق
      </button>
    </form>

    <form id="verifyForm" class="hidden">
      <h2>تأكيد البريد الإلكتروني</h2>

      <p class="muted">
        أدخل البريد الإلكتروني والرمز المكوّن من 6 أرقام
        الذي وصلك بالبريد.
      </p>

      <label for="verifyEmail">البريد الإلكتروني</label>
      <input id="verifyEmail" type="email" required>

      <label for="verifyCode">رمز التحقق</label>
      <input
        id="verifyCode"
        inputmode="numeric"
        autocomplete="one-time-code"
        pattern="[0-9]{6}"
        maxlength="6"
        required
      >

      <button type="submit">تأكيد البريد</button>

      <button type="button" id="resendCode" class="secondary">
        إعادة إرسال الرمز
      </button>
    </form>

    <form id="forgotForm" class="hidden">
      <h2>استرجاع كلمة المرور</h2>

      <label for="forgotEmail">البريد الإلكتروني المسجل</label>
      <input id="forgotEmail" type="email" required>

      <button type="submit">إرسال رابط الاسترجاع</button>
    </form>

    <form id="resetForm" class="hidden">
      <h2>تعيين كلمة مرور جديدة</h2>

      <label for="resetPassword">كلمة المرور الجديدة</label>
      <input
        id="resetPassword"
        type="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <label for="resetConfirm">تأكيد كلمة المرور</label>
      <input
        id="resetConfirm"
        type="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <button type="submit">حفظ كلمة المرور الجديدة</button>
    </form>

  </section>
</main>
</body>
</html>
