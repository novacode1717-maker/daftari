<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتري - نظام الاقساط</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.png">
<link rel="apple-touch-icon" href="/static/icon-192x192.png">
<meta name="theme-color" content="#FFD700">
<meta name="background-color" content="#050505">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:#050505;color:#FFD700}
.gold-gradient{background:linear-gradient(135deg,#FFD700,#D4AF37)}
.gold-border{border:2px solid #FFD700;box-shadow:0 0 20px rgba(255,215,0,0.3)}
.gold-glow:hover{box-shadow:0 0 30px rgba(255,215,0,0.6);transform:translateY(-2px);transition:0.3s}
.input-gold{background:#111;border:1px solid #333;color:#FFD700}
.input-gold:focus{border-color:#FFD700;outline:none;box-shadow:0 0 10px rgba(255,215,0,0.3)}
</style>
</head>
<body class="min-h-screen">
<!-- Header -->
<div class="text-center pt-10 pb-6">
<img src="/static/icon.png" class="w-20 h-20 rounded-2xl mx-auto gold-border">
<h1 class="text-4xl font-black mt-4">دفتري</h1>
<p class="text-gray-400 mt-2">نظام الاقساط الفاخر - اسود وذهبي</p>
</div>

<!-- Tabs -->
<div class="flex justify-center gap-2 px-4 mb-6 flex-wrap">
<button onclick="showTab('home')" class="tab-btn bg-[#FFD700] text-black px-5 py-2 rounded-xl font-bold">الرئيسية</button>
<button onclick="showTab('customers')" class="tab-btn bg-[#111] border border-[#FFD700] px-5 py-2 rounded-xl">زبائني</button>
<button onclick="showTab('add')" class="tab-btn bg-[#111] border border-[#FFD700] px-5 py-2 rounded-xl">اضافة زبون</button>
<button onclick="showTab('help')" class="tab-btn bg-[#111] border border-[#FFD700] px-5 py-2 rounded-xl">مركز المساعدة</button>
</div>

<!-- Content -->
<div id="home" class="tab px-6">
<div class="bg-[#111] gold-border rounded-2xl p-6 text-center gold-glow">
<h2 class="text-2xl font-bold mb-2">مرحبا بك في دفتري 👑</h2>
<p class="text-gray-400">النظام الفاخر لادارة الاقساط</p>
<div class="grid grid-cols-2 gap-4 mt-6">
<div class="bg-[#050505] border border-[#FFD700]/30 rounded-xl p-4">
<p class="text-gray-400 text-sm">عدد الزبائن</p>
<p id="count" class="text-2xl font-black">0</p>
</div>
<div class="bg-[#050505] border border-[#FFD700]/30 rounded-xl p-4">
<p class="text-gray-400 text-sm">المتبقي الكلي</p>
<p id="total" class="text-2xl font-black">0 د.ع</p>
</div>
</div>
<input id="ownerPhone" placeholder="رقم صاحب المتجر" class="input-gold w-full mt-6 p-3 rounded-xl text-center" />
<button onclick="loadCustomers()" class="gold-gradient text-black w-full mt-3 p-3 rounded-xl font-bold">تحميل البيانات</button>
</div>
</div>

<div id="customers" class="tab hidden px-6">
<div id="customersList" class="space-y-4"></div>
</div>

<div id="add" class="tab hidden px-6">
<div class="bg-[#111] gold-border rounded-2xl p-6">
<h3 class="font-bold text-xl mb-4">اضافة زبون جديد</h3>
<input id="cName" placeholder="اسم الزبون" class="input-gold w-full p-3 rounded-xl mb-3">
<input id="cPhone" placeholder="رقم الزبون" class="input-gold w-full p-3 rounded-xl mb-3">
<input id="cItem" placeholder="نوع المادة" class="input-gold w-full p-3 rounded-xl mb-3">
<input id="cTotal" type="number" placeholder="المبلغ الكلي" class="input-gold w-full p-3 rounded-xl mb-3">
<input id="cPaid" type="number" placeholder="المدفوع مقدم" class="input-gold w-full p-3 rounded-xl mb-3">
<button onclick="addCustomer()" class="gold-gradient text-black w-full p-3 rounded-xl font-bold">اضافة</button>
</div>
</div>

<div id="help" class="tab hidden px-6">
<div class="bg-[#111] gold-border rounded-2xl p-6 mb-6">
<h3 class="font-bold text-xl mb-4">مركز المساعدة</h3>
<input id="hName" placeholder="اسمك" class="input-gold w-full p-3 rounded-xl mb-3">
<input id="hPhone" placeholder="رقمك" class="input-gold w-full p-3 rounded-xl mb-3">
<input id="hSubject" placeholder="الموضوع" class="input-gold w-full p-3 rounded-xl mb-3">
<textarea id="hMessage" placeholder="رسالتك" class="input-gold w-full p-3 rounded-xl mb-3 h-24"></textarea>
<button onclick="sendHelp()" class="gold-gradient text-black w-full p-3 rounded-xl font-bold">ارسال</button>
</div>
<div id="tickets" class="space-y-3"></div>
</div>

<script>
let owner = localStorage.getItem('owner') || '';
document.getElementById('ownerPhone').value = owner;

function showTab(id){
 document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('.tab-btn').forEach(b=>{b.className='tab-btn bg-[#111] border border-[#FFD700] px-5 py-2 rounded-xl';});
 event.target.className='tab-btn bg-[#FFD700] text-black px-5 py-2 rounded-xl font-bold';
 if(id==='customers') loadCustomers();
 if(id==='help') loadTickets();
}

async function loadCustomers(){
 owner = document.getElementById('ownerPhone').value;
 if(!owner){alert('دخل رقم صاحب المتجر');return;}
 localStorage.setItem('owner',owner);
 try{
  const res = await fetch(`/store/${owner}/customers`);
  const data = await res.json();
  document.getElementById('count').innerText = data['عدد_الزبائن'] || data.عدد_الزبائن || 0;
  const list = data['الزبائن'] || data.الزبائن || [];
  let total=0; list.forEach(c=>total+=(c['المتبقي']||c.المتبقي||0));
  document.getElementById('total').innerText = total.toLocaleString()+' د.ع';
  const div = document.getElementById('customersList');
  div.innerHTML = list.map(c=>`
   <div class="bg-[#111] border border-[#FFD700]/40 rounded-2xl p-4 gold-glow">
    <div class="flex justify-between"><span class="font-bold">${c['اسم_الزبون']||c.اسم_الزبون}</span><span class="text-[#FFD700]">${c['المتبقي']||c.المتبقي} د.ع متبقي</span></div>
    <p class="text-gray-400 text-sm mt-1">${c['نوع_المادة']||c.نوع_المادة} - ${c['رقم_الزبون']||c.رقم_الزبون}</p>
    <div class="flex gap-2 mt-2 text-xs"><span class="bg-[#050505] px-2 py-1 rounded">الكلي: ${c['المبلغ_الكلي']||c.المبلغ_الكلي}</span><span class="bg-[#FFD700] text-black px-2 py-1 rounded font-bold">المدفوع: ${c['المدفوع']||c.المدفوع}</span></div>
   </div>`).join('') || '<p class="text-center text-gray-500">لا يوجد زبائن</p>';
 }catch(e){alert('خطأ: '+e)}
}

async function addCustomer(){
 owner = localStorage.getItem('owner') || document.getElementById('ownerPhone').value;
 if(!owner){alert('دخل رقم صاحب المتجر اولا');return;}
 const data = {
  owner_phone: owner,
  customer_name: document.getElementById('cName').value,
  customer_phone: document.getElementById('cPhone').value,
  item_type: document.getElementById('cItem').value,
  total_amount: parseInt(document.getElementById('cTotal').value)||0,
  first_payment: parseInt(document.getElementById('cPaid').value)||0,
  monthly_installment: 0
 };
 if(!data.customer_name){alert('دخل اسم الزبون');return;}
 const res = await fetch('/store/add-customer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const r = await res.json();
 if(r['نجاح']||r.نجاح){alert('تم اضافة الزبون ✅'); showTab('customers'); loadCustomers();}
 else alert('خطأ');
}

async function sendHelp(){
 owner = localStorage.getItem('owner') || '';
 const data = {
  name: document.getElementById('hName').value,
  phone: document.getElementById('hPhone').value,
  subject: document.getElementById('hSubject').value,
  message: document.getElementById('hMessage').value,
  owner_phone: owner || 'عام'
 };
 const res = await fetch('/help/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const r = await res.json();
 if(r['نجاح']||r.نجاح){alert('تم ارسال رسالتك ✅ رقم التذكرة: '+(r['رقم_التذكرة']||'')); loadTickets();}
}

async function loadTickets(){
 try{
  const res = await fetch('/help/tickets');
  const data = await res.json();
  const list = data['الرسائل']||data.الرسائل||[];
  document.getElementById('tickets').innerHTML = list.slice().reverse().map(t=>`
   <div class="bg-[#111] border border-[#FFD700]/20 rounded-xl p-3">
    <div class="flex justify-between text-sm"><span class="font-bold">${t.name}</span><span class="text-gray-500">${t.date}</span></div>
    <p class="text-[#FFD700] text-sm mt-1">${t.subject}</p>
    <p class="text-gray-300 text-sm mt-1">${t.message}</p>
    <span class="text-xs mt-2 inline-block px-2 py-1 rounded ${t.status==='جديد'?'bg-red-900':'bg-green-900'}">${t.status}</span>
   </div>`).join('');
 }catch(e){}
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js');
}
</script>
</body>
</html>
