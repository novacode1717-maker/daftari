<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
 <title>دفتري</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#050505;color:#FFD700;text-align:center;padding:20px">
<h1 style="font-size:32px;font-weight:900">دفتري 👑</h1>
<p>نظام الاقساط الفاخر</p>

<div style="background:#111;border:2px solid #FFD700;border-radius:16px;padding:20px;margin-top:20px">
<h3>اضافة زبون جديد</h3>
<input id="cName" placeholder="اسم الزبون" style="background:#000;color:#FFD700;border:1px solid #333;padding:10px;width:90%;margin:5px;border-radius:8px">
<input id="cFather" placeholder="اسم اب الزبون" style="background:#000;color:#FFD700;border:1px solid #333;padding:10px;width:90%;margin:5px;border-radius:8px">
<input id="store" placeholder="اسم المتجر" style="background:#000;color:#FFD700;border:1px solid #333;padding:10px;width:90%;margin:5px;border-radius:8px">
<input id="cPhone" placeholder="رقم الزبون" style="background:#000;color:#FFD700;border:1px solid #333;padding:10px;width:90%;margin:5px;border-radius:8px">
<input id="cItem" placeholder="نوع المادة" style="background:#000;color:#FFD700;border:1px solid #333;padding:10px;width:90%;margin:5px;border-radius:8px">
<input id="cTotal" type="number" placeholder="المبلغ الكلي" style="background:#000;color:#FFD700;border:1px solid #333;padding:10px;width:28%;margin:5px;border-radius:8px">
<input id="cPaid" type="number" placeholder="المدفوع" style="background:#000;color:#FFD700;border:1px solid #333;padding:10px;width:28%;margin:5px;border-radius:8px">
<input id="cMonthly" type="number" placeholder="القسط" style="background:#000;color:#FFD700;border:1px solid #333;padding:10px;width:28%;margin:5px;border-radius:8px">
<br>
<button onclick="add()" style="background:linear-gradient(135deg,#FFD700,#D4AF37);color:#000;padding:12px;width:95%;border-radius:12px;font-weight:bold;margin-top:10px">اضافة</button>
</div>

<div id="list" style="margin-top:20px"></div>

<script>
let owner = localStorage.getItem('owner')'07700000000';
async function add(){
 let data={
  owner_phone: owner,
  store_name: document.getElementById('store').value,
  customer_name: document.getElementById('cName').value,
  father_name: document.getElementById('cFather').value,
  customer_phone: document.getElementById('cPhone').value,
  item_type: document.getElementById('cItem').value,
  total_amount: parseInt(document.getElementById('cTotal').value)0,
  first_payment: parseInt(document.getElementById('cPaid').value)0,
  monthly_installment: parseInt(document.getElementById('cMonthly').value)0
 };
 await fetch('/store/add-customer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 alert('تم ✅');
 load();
}
async function load(){
 let res=await fetch(/store/${owner}/customers);
 let d=await res.json();
 let list=d['الزبائن']||[];
 document.getElementById('list').innerHTML=list.map(c=><div style="background:#111;border:1px solid #FFD700;border-radius:12px;padding:10px;margin:5px"><b>${c['اسم_الزبون']} بن ${c['اسم_الاب']||''}</b> - ${c['المتبقي']} د.ع متبقي<br><small>${c['نوع_المادة']} - ${c['اسم_المتجر']}</small></div>).join('');
}
load();
</script>
</body>
</html>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}
</script>
