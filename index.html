<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتري - نظام الاقساط</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.png">
<meta name="theme-color" content="#FFD700">
<meta name="background-color" content="#050505">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:#050505;color:#FFD700}
.gold-gradient{background:linear-gradient(135deg,#FFD700,#D4AF37)}
.gold-border{border:2px solid #FFD700;box-shadow:0 0 20px rgba(255,215,0,0.3)}
.gold-glow:hover{box-shadow:0 0 30px rgba(255,215,0,0.6);transform:translateY(-2px);transition:0.3s}
.input-gold{background:#111;border:1px solid #333;color:#FFD700}
.input-gold:focus{border-color:#FFD700;outline:none;box-shadow:0 0 10px rgba(255,215,0,0.3)}
.auth-tab.active{background:#FFD700;color:#000;font-weight:900}
.tab-btn.active{background:#FFD700;color:#000;font-weight:900}
</style>
</head>
<body class="min-h-screen">
<div id="auth" class="min-h-screen p-4">
<div class="text-center pt-8 pb-4">
<img src="/static/icon.png" class="w-20 h-20 rounded-2xl mx-auto gold-border" onerror="this.style.display='none'">
<h1 class="text-4xl font-black mt-4">دفتري 👑</h1>
<p class="text-gray-500 text-sm mt-2">نظام الاقساط الفاخر - اسود وذهبي</p>
</div>
<div class="flex bg-[#111] rounded-xl p-1 mt-6 max-w-md mx-auto border border-[#333]">
<button onclick="showAuth('login',this)" class="auth-tab active bg-[#FFD700] text-black flex-1 py-2.5 rounded-lg font-bold text-sm">دخول</button>
<button onclick="showAuth('register',this)" class="auth-tab flex-1 py-2.5 rounded-lg text-gray-400 text-sm">انشاء حساب</button>
<button onclick="showAuth('recover',this)" class="auth-tab flex-1 py-2.5 rounded-lg text-gray-400 text-sm">استرجاع</button>
</div>
<div class="max-w-md mx-auto mt-6">
<div id="loginTab" class="auth-content bg-[#111] gold-border rounded-2xl p-5">
<h3 class="font-bold mb-4 text-center">تسجيل الدخول</h3>
<input id="loginPhone" placeholder="رقم الموبايل" class="input-gold w-full p-3 rounded-xl mb-3 text-center">
<input id="loginPass" type="password" placeholder="كلمة السر" class="input-gold w-full p-3 rounded-xl mb-4 text-center">
<button onclick="doLogin()" class="gold-gradient text-black w-full p-3 rounded-xl font-bold">دخول + رسالة واتساب 📱</button>
</div>
<div id="registerTab" class="auth-content hidden bg-[#111] gold-border rounded-2xl p-5">
<h3 class="font-bold mb-4 text-center">انشاء حساب متجر جديد</h3>
<div class="grid grid-cols-3 gap-2 mb-3">
<input id="regFirst" placeholder="الاسم الاول" class="input-gold p-2.5 rounded-xl text-center text-sm">
<input id="regSecond" placeholder="اسم الاب" class="input-gold p-2.5 rounded-xl text-center text-sm">
<input id="regLast" placeholder="اللقب" class="input-gold p-2.5 rounded-xl text-center text-sm">
</div>
<select id="regGov" class="input-gold w-full p-3 rounded-xl mb-3 text-sm">
<option value="">اختر المحافظة</option>
<option>بغداد</option><option>البصرة</option><option>نينوى</option><option>الانبار</option><option>بابل</option><option>كربلاء</option><option>النجف</option><option>القادسية</option><option>ذي قار</option><option>ميسان</option><option>واسط</option><option>ديالى</option><option>صلاح الدين</option><option>كركوك</option><option>اربيل</option><option>دهوك</option><option>السليمانية</option><option>المثنى</option>
</select>
<input id="regAddress" placeholder="العنوان التفصيلي" class="input-gold w-full p-3 rounded-xl mb-3 text-sm">
<input id="regStore" placeholder="اسم المتجر" class="input-gold w-full p-3 rounded-xl mb-3">
<input id="regPhone" placeholder="رقم الموبايل -
 واتساب" class="input-gold w-full p-3 rounded-xl mb-3 text-center">
<input id="regPass" type="password" placeholder="كلمة السر" class="input-gold w-full p-3 rounded-xl mb-4 text-center">
<button onclick="doRegister()" class="gold-gradient text-black w-full p-3 rounded-xl font-bold">انشاء حساب + كود واتساب 📱</button>
</div>
<div id="recoverTab" class="auth-content hidden bg-[#111] gold-border rounded-2xl p-5 text-center">
<h3 class="font-bold mb-4">استرجاع الحساب</h3>
<input id="recPhone" placeholder="رقم الموبايل" class="input-gold w-full p-3 rounded-xl mb-3 text-center">
<button onclick="doRecover()" class="gold-gradient text-black w-full p-3 rounded-xl font-bold">استرجاع بكود واتساب</button>
<div id="recResult" class="hidden mt-4 bg-[#050505] border border-[#FFD700]/30 rounded-xl p-3"></div>
</div>
<div id="otpTab" class="auth-content hidden bg-[#111] gold-border rounded-2xl p-5 text-center">
<h3 class="font-bold mb-2">تأكيد واتساب</h3>
<p id="otpInfo" class="text-gray-400 text-xs mb-4"></p>
<input id="otpCode" placeholder="000000" class="input-gold w-full p-4 rounded-xl mb-4 text-center text-2xl tracking-[0.5em]">
<button onclick="verifyOtp()" class="gold-gradient text-black w-full p-3 rounded-xl font-bold">تأكيد الكود ✅</button>
<p id="otpDemo" class="text-[#FFD700] text-xs mt-3 font-bold"></p>
</div>
</div>
</div>
