function showAuthTab(id, btn){
 document.querySelectorAll('.auth-content').forEach(t=>t.classList.add('hidden'));
 document.getElementById(id+'Tab').classList.remove('hidden');
 document.querySelectorAll('.auth-tab').forEach(b=>{b.classList.remove('active','bg-[#FFD700]','text-black');});
 if(btn){btn.classList.add('active','bg-[#FFD700]','text-black');}
}

function showTab(id, btn){
 document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));
 const target = document.getElementById(id);
 if(target) target.classList.remove('hidden');
 document.querySelectorAll('.tab-btn').forEach(b=>{b.className='tab-btn bg-[#111] border border-[#FFD700] px-4 py-2 rounded-xl text-sm';});
 if(btn){btn.className='tab-btn active bg-[#FFD700] text-black px-4 py-2 rounded-xl font-bold text-sm';}
 if(id==='customers') loadCustomers();
 if(id==='help') loadTickets();
}

async function doRegister(){
 const data={
  first_name: document.getElementById('regFirst').value.trim(),
  second_name: document.getElementById('regSecond').value.trim(),
  last_name: document.getElementById('regLast').value.trim(),
  store_name: document.getElementById('regStore').value.trim(),
  phone: document.getElementById('regPhone').value.trim(),
  password: document.getElementById('regPass').value.trim()
 };
 if(!data.first_name!data.phone||!data.password){alert('اكمل الحقول');return;}
 try{
  const res=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const r=await res.json();
  if(r.error){alert(r.error);return;}
  currentPhone=data.phone;
  document.getElementById('otpInfo').innerText=كود واتساب للرقم ${data.phone};
  document.getElementById('otpDemo').innerText=كود تجريبي: ${r.demo_otp||''};
  document.querySelectorAll('.auth-content').forEach(t=>t.classList.add('hidden'));
  document.getElementById('otpTab').classList.remove('hidden');
  localStorage.setItem('currentPhone', currentPhone);
 }catch(e){alert(e.message)}
}
