<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتري - نظام الاقساط</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.png">
<meta name="theme-color" content="#FFD700">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:#050505;color:#FFD700}
.gold-gradient{background:linear-gradient(135deg,#FFD700,#D4AF37)}
.gold-border{border:2px solid #FFD700;box-shadow:0 0 20px rgba(255,215,0,0.3)}
.input-gold{background:#111;border:1px solid #333;color:#FFD700}
.input-gold:focus{border-color:#FFD700;outline:none;box-shadow:0 0 10px rgba(255,215,0,0.3)}
.auth-tab.active{background:#FFD700;color:#000;font-weight:900}
.tab-btn.active{background:#FFD700;color:#000;font-weight:900}
</style>
</head>
<body class="min-h-screen">
<div id="auth" class="min-h-screen p-4">
<div class="text-center pt-8 pb-4">
<h1 class="text-4xl font-black">دفتري 👑</h1>
<p class="text-gray-500 text-sm mt-2">نظام الاقساط الفاخر - 400 سطر</p>
</div>
<div class="flex bg-[#111] rounded-xl p-1 mt-6 max-w-md mx-auto border border-[#333]">
<button onclick="showAuth('login',this)" class="auth-tab active bg-[#FFD700] text-black flex-1 py-2.5 rounded-lg font-bold text-sm">دخول</button>
<button onclick="showAuth('register',this)" class="auth-tab flex-1 py-2.5 rounded-lg text-gray-400 text-sm">انشاء حساب</button>
<button onclick="showAuth('recover',this)" class="auth-tab flex-1 py-2.5 rounded-lg text-gray-400 text-sm">استرجاع</button>
</div>
<div class="max-w-md mx-auto mt-6">
<div id="loginTab" class="auth-content bg-[#111] gold-border rounded-2xl p-5">
<h3 class="font-bold mb-4 text-center">تسجيل الدخول</h3>
<input id="loginPhone" placeholder="رقم الموبايل" class="input-gold w-full p-3 rounded-xl mb-3 text-center">
<input id="loginPass" type="password" placeholder="كلمة السر" class="input-gold w-full p-3 rounded-xl mb-4 text-center">
<button onclick="doLogin()" class="gold-gradient text-black w-full p-3 rounded-xl font-bold">دخول + رسالة واتساب 📱</button>
</div>
